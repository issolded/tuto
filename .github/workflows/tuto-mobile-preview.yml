name: Tuto Android validation
on:
  push:
    branches: [main, 'codex/android-*']
    paths: ['mobile/**', 'src/lib/**', 'src/components/**', 'design/native-icons/**', 'server/puzzle/**', '.github/workflows/tuto-mobile-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tuto-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The app runs the web's own maths engine and figures (mobile/engine), so it is built from
      # the web sources on every run and checked in real QuickJS before Gradle sees it.
      - name: Build the maths engine from the web sources
        working-directory: .
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix mobile/engine --no-audit --no-fund
          node mobile/engine/build.mjs
          node mobile/engine/qjs-test.mjs
          node mobile/engine/review-test.mjs
          node mobile/engine/puzzle-test.mjs
      - run: node prepare-assets.mjs
      - run: gradle :shared:jvmTest :androidApp:testDebugUnitTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
      - name: Verify distributable APK signature and 16 KiB native alignment
        run: |
          python3 check-apk-native.py androidApp/build/outputs/apk/debug/androidApp-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 androidApp/build/outputs/apk/debug/androidApp-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tuto-android-validation-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-reports
          path: |
            mobile/shared/build/reports/
            mobile/androidApp/build/reports/
  tablet:
    strategy:
      fail-fast: false
      matrix:
        target: [default, google_apis_ps16k]
    # This job builds its own APKs. Run independently of the JVM/lint build;
    # both remain required evidence, without serializing two isolated builds.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The app runs the web's own maths engine and figures (mobile/engine), so it is built from
      # the web sources on every run and checked in real QuickJS before Gradle sees it.
      - name: Build the maths engine from the web sources
        working-directory: .
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix mobile/engine --no-audit --no-fund
          node mobile/engine/build.mjs
          node mobile/engine/qjs-test.mjs
          node mobile/engine/review-test.mjs
          node mobile/engine/puzzle-test.mjs
      - run: node mobile/prepare-assets.mjs
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          ndk: 28.0.13004108
          cmake: 3.22.1
          profile: pixel_tablet
          disable-animations: true
          script: bash mobile/run-device-tests.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-test-report-${{ matrix.target }}
          path: |
            mobile/androidApp/build/reports/androidTests/
            mobile-screenshots/
            mobile/mobile-screenshots/
