name: Tuto Android preview
on:
  push:
    branches: [mobile/native-tablet-preview]
    paths: ['mobile/**', '.github/workflows/tuto-mobile-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tuto-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: node prepare-assets.mjs
      - run: gradle :shared:jvmTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tuto-android-preview-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-test-reports
          path: |
            mobile/shared/build/reports/
            mobile/androidApp/build/reports/
  tablet:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: node mobile/prepare-assets.mjs
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: |
            cd mobile && gradle :androidApp:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/app.tuto.mobile.preview/files/screenshots mobile-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-test-report
          path: |
            mobile/androidApp/build/reports/androidTests/
            mobile-screenshots/
            mobile/mobile-screenshots/

