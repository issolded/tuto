<!-- Home tile icon for the puzzle (NVR) module, chosen 2026-09-16 (variant A of three).
     Same system as the TaskIcon SVGs in src/screens/ChildHome.jsx: 64 viewBox, white body,
     #20201e 4px outline, detail in the tile accent. The picture is a grid-complete question
     itself — three cells filled, the fourth asks — so the icon shows what the screen does.
     Tile colours: bg #D9F3F1, accent #2BA59A (no other tile is teal; pink was tried and dropped).
     Drawn inline as the 'puzzle' branch of TaskIcon in src/screens/ChildHome.jsx (camelCased there);
     this file is the reference copy. -->
